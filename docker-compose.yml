version: "3.9"

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./social_rest
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017/social
    depends_on:
      - mongodb
    volumes:
      - ./social_rest:/app
      - backend-node-modules:/app/node_modules
    command: npm run dev

volumes:
  mongo-data:
  backend-node-modules:

