version: "3.9"

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./social_rest
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017/social
    depends_on:
      - mongodb

volumes:
  mongo-data: