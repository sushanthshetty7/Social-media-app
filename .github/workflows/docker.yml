
name: Build and Deploy Social Media App

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: sushanthshetty7/social-backend
      FRONTEND_IMAGE: sushanthshetty7/social-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./social_rest
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./react_client
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  
  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

     
      
      
      - name: Deploy through SSM
        env:
          INSTANCE_ID: i-060a6dd047323b971
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          PARAMETERS=$(jq -n --arg tag "$IMAGE_TAG" '{
            commands: [
              "set -e",
              "cd /home/ubuntu/social-app",
              ("export IMAGE_TAG=" + $tag),
              "docker compose config -q",
              "docker compose pull backend frontend",
              "docker compose up -d backend frontend",
              "docker compose ps",
              "docker ps --format \"table {{.Names}}\\t{{.Image}}\\t{{.Status}}\""
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "[Status,StandardErrorContent,StandardOutputContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment did not finish within 6 minutes."
          exit 1


